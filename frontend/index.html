<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Security Dashboard</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>

  <style>
    body {
      font-family: "JetBrains Mono", monospace;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-ok {
      background: #22c55e;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.8);
    }

    .dot-alert {
      background: #ef4444;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.8);
    }

    .dot-warn {
      background: #f59e0b;
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.8);
    }

    .dot-idle {
      background: #64748b;
    }

    .video-stream {
      width: 100%;
      height: 100%;
      background: black;
      object-fit: contain;
    }

    .spinner {
      width: 24px;
      height: 24px;

      border: 3px solid #1f2937;
      border-top-color: #3b82f6;

      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body class="min-h-screen bg-slate-950 text-slate-100">

  <main class="mx-auto max-w-[1600px] p-4 md:p-6 lg:p-8 space-y-7">

    <!-- HEADER -->
    <header class="
      flex flex-col gap-4
      border-b border-slate-800
      pb-5
      md:flex-row
      md:items-center
      md:justify-between
    ">

      <div>
        <h1 class="text-2xl font-bold">
          Agen Pegadaian Cilangkap
        </h1>

        <p class="mt-1 text-sm text-slate-400">
          Realtime Sensor & CCTV Monitoring
        </p>
      </div>

      <div class="flex flex-wrap items-center gap-3 text-xs">

        <div class="
          rounded-lg
          border border-slate-800
          bg-slate-900
          px-3 py-2
        ">
          <span class="text-slate-500">API</span>

          <span id="apiStatus" class="ml-2 font-semibold text-amber-400">
            CONNECTING
          </span>
        </div>

        <div id="lastUpdate" class="
          rounded-lg
          border border-slate-800
          bg-slate-900
          px-3 py-2
          text-slate-400
        ">
          Memuat...
        </div>

      </div>
    </header>


    <!-- SENSOR -->
    <section class="space-y-3">

      <div class="flex items-center justify-between">

        <h2 class="text-base font-semibold text-slate-200">
          Sensor & NVR
        </h2>

        <span class="text-xs text-slate-500">
          Refresh 1 detik
        </span>

      </div>

      <div id="sensorGrid" class="
        grid
        grid-cols-1
        gap-3
        sm:grid-cols-2
        lg:grid-cols-3
        xl:grid-cols-4
      ">

        <div class="col-span-full flex justify-center py-8">
          <div class="spinner"></div>
        </div>

      </div>

    </section>


    <!-- CCTV -->
    <section class="space-y-3">

      <div class="flex items-center justify-between">

        <h2 class="text-base font-semibold text-slate-200">
          Live CCTV
        </h2>

        <span id="cameraCount" class="text-xs text-slate-500">
          0 kamera
        </span>

      </div>

      <div id="videoGrid" class="
        grid
        grid-cols-1
        gap-4
        sm:grid-cols-2
        xl:grid-cols-3
        2xl:grid-cols-4
      ">

        <div class="col-span-full flex justify-center py-8">
          <div class="spinner"></div>
        </div>

      </div>

    </section>

  </main>


  <script>

    const SENSOR_REFRESH_MS = 1000;

    /*
     * Jangan start 8 kamera persis bersamaan.
     * Beri napas sedikit ke FFmpeg / mini PC.
     */
    const CAMERA_STAGGER_MS = 700;


    /*
    |--------------------------------------------------------------------------
    | HLS PLAYER STORAGE
    |--------------------------------------------------------------------------
    */

    const players = new Map();
    const restartTimers = new Map();

    let sensorRequestRunning = false;
    let camerasLoaded = false;


    /*
    |--------------------------------------------------------------------------
    | SENSOR CONFIGURATION
    |--------------------------------------------------------------------------
    */

    const sensorDefinitions = [

      {
        id: "alarm",
        label: "Alarm",
        state: "state_alarm",
        battery: "battery_alarm"
      },

      {
        id: "smoke",
        label: "Smoke",
        state: "state_smoke",
        battery: "battery_smoke"
      },

      {
        id: "water_leak",
        label: "Water Leak",
        state: "state_water_leak",
        battery: "battery_water_leak"
      },

      {
        id: "panic",
        label: "Panic",
        state: "state_panic",
        battery: "battery_panic"
      },

      {
        id: "pir",
        label: "PIR",
        state: "state_pir",
        battery: "battery_pir"
      },

      {
        id: "door",
        label: "Door",
        state: "state_door",
        battery: "battery_door"
      },

      {
        id: "nvr",
        label: "NVR",
        state: "state_nvr",
        battery: null
      }

    ];


    /*
    |--------------------------------------------------------------------------
    | HELPER
    |--------------------------------------------------------------------------
    */

    function escapeHtml(value) {

      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    async function fetchJSON(url, timeoutMs = 5000) {

      const controller = new AbortController();

      const timer = setTimeout(() => {
        controller.abort();
      }, timeoutMs);


      try {

        const response = await fetch(url, {

          signal: controller.signal,

          /*
           * Sensor harus realtime.
           */
          cache: "no-store"

        });


        const data = await response
          .json()
          .catch(() => ({}));


        if (!response.ok) {

          throw new Error(
            data.details ||
            data.error ||
            `HTTP ${response.status}`
          );

        }


        return data;

      }

      finally {

        clearTimeout(timer);

      }

    }


    /*
    |--------------------------------------------------------------------------
    | SENSOR
    |--------------------------------------------------------------------------
    */

    function normalizeState(value) {

      if (value === true || value === 1) {
        return "ON";
      }

      if (value === false || value === 0) {
        return "OFF";
      }


      const str = String(
        value ?? "UNKNOWN"
      )
        .trim()
        .toUpperCase();


      if (
        [
          "TRUE",
          "ACTIVE",
          "ALARM",
          "OPEN",
          "DETECTED",
          "WET"
        ].includes(str)
      ) {
        return "ON";
      }


      if (
        [
          "FALSE",
          "INACTIVE",
          "NORMAL",
          "CLOSED",
          "DRY"
        ].includes(str)
      ) {
        return "OFF";
      }


      return str || "UNKNOWN";

    }


    function getSensorVisual(sensorId, value) {

      const state = normalizeState(value);


      /*
       * NVR:
       * ON = bagus
       */
      if (sensorId === "nvr") {

        if (
          state === "ON" ||
          state === "ONLINE"
        ) {

          return {

            state: "ONLINE",

            dot: "dot-ok",

            text: "text-emerald-400",

            border: "border-emerald-900/70"

          };

        }


        return {

          state,

          dot: "dot-alert",

          text: "text-red-400",

          border: "border-red-900/70"

        };

      }


      /*
       * Sensor security:
       *
       * OFF = kondisi normal / aman
       * ON  = trigger / alarm
       */
      if (state === "OFF") {

        return {

          state: "OFF",

          dot: "dot-ok",

          text: "text-emerald-400",

          border: "border-slate-800"

        };

      }


      if (state === "ON") {

        return {

          state: "ON",

          dot: "dot-alert",

          text: "text-red-400",

          border: "border-red-900/70"

        };

      }


      return {

        state,

        dot: "dot-idle",

        text: "text-slate-400",

        border: "border-slate-800"

      };

    }


    function renderSensorCards() {

      const grid =
        document.getElementById("sensorGrid");


      grid.innerHTML =
        sensorDefinitions
          .map(sensor => {

            return `

          <article
            id="sensor-${sensor.id}"
            class="
              rounded-xl
              border border-slate-800
              bg-slate-900/80
              p-4
            "
          >

            <div
              class="
                flex
                items-center
                justify-between
              "
            >

              <span
                class="
                  text-xs
                  font-semibold
                  uppercase
                  tracking-wider
                  text-slate-400
                "
              >
                ${escapeHtml(sensor.label)}
              </span>

              <span
                id="sensor-dot-${sensor.id}"
                class="status-dot dot-idle"
              ></span>

            </div>


            <div
              class="
                mt-3
                flex
                items-end
                justify-between
                gap-3
              "
            >

              <div
                id="sensor-state-${sensor.id}"
                class="
                  text-xl
                  font-bold
                  text-slate-400
                "
              >
                --
              </div>


              ${sensor.battery

                ? `

                  <div class="text-right">

                    <div
                      class="
                        text-[10px]
                        uppercase
                        text-slate-600
                      "
                    >
                      Battery
                    </div>

                    <div
                      id="sensor-battery-${sensor.id}"
                      class="
                        text-sm
                        font-semibold
                        text-slate-300
                      "
                    >
                      --
                    </div>

                  </div>

                `

                : `

                  <div class="text-right">

                    <div
                      class="
                        text-[10px]
                        uppercase
                        text-slate-600
                      "
                    >
                      Cameras
                    </div>

                    <div
                      id="sensor-camera-count-${sensor.id}"
                      class="
                        text-sm
                        font-semibold
                        text-slate-300
                      "
                    >
                      --
                    </div>

                  </div>

                `
              }

            </div>

          </article>

        `;

          })
          .join("");

    }


    function updateSensorCards(data) {

      for (const sensor of sensorDefinitions) {

        const card =
          document.getElementById(
            `sensor-${sensor.id}`
          );


        const dot =
          document.getElementById(
            `sensor-dot-${sensor.id}`
          );


        const stateText =
          document.getElementById(
            `sensor-state-${sensor.id}`
          );


        if (
          !card ||
          !dot ||
          !stateText
        ) {
          continue;
        }


        const visual =
          getSensorVisual(
            sensor.id,
            data[sensor.state]
          );


        card.className =
          `
      rounded-xl
      border
      ${visual.border}
      bg-slate-900/80
      p-4
      `;


        dot.className =
          `status-dot ${visual.dot}`;


        stateText.className =
          `text-xl font-bold ${visual.text}`;


        stateText.textContent =
          visual.state;


        /*
         * Battery
         */
        if (sensor.battery) {

          const batteryElement =
            document.getElementById(
              `sensor-battery-${sensor.id}`
            );


          const battery =
            data[sensor.battery];


          if (batteryElement) {

            batteryElement.textContent =
              battery === undefined ||
                battery === null

                ? "--"

                : `${battery}%`;


            if (
              battery !== undefined &&
              battery !== null &&
              Number(battery) <= 20
            ) {

              batteryElement.className =
                "text-sm font-semibold text-red-400";

            }

            else {

              batteryElement.className =
                "text-sm font-semibold text-slate-300";

            }

          }

        }

      }


      /*
       * Jumlah kamera dari NVR.
       */
      const nvrCount =
        document.getElementById(
          "sensor-camera-count-nvr"
        );


      if (nvrCount) {

        nvrCount.textContent =
          data.nvr_camera_count ?? "--";

      }


      /*
       * API status.
       */
      const apiStatus =
        document.getElementById(
          "apiStatus"
        );


      apiStatus.textContent =
        "ONLINE";


      apiStatus.className =
        "ml-2 font-semibold text-emerald-400";


      /*
       * Timestamp.
       */
      const bridgeTimestamp =
        data.timestamp
          ? ` | Bridge: ${data.timestamp}`
          : "";


      document.getElementById(
        "lastUpdate"
      ).textContent =
        `Update: ${new Date()
          .toLocaleTimeString("id-ID")
        }${bridgeTimestamp}`;

    }


    async function pollSensors() {

      /*
       * Jangan bikin request menumpuk
       * jika request sebelumnya belum selesai.
       */
      if (sensorRequestRunning) {
        return;
      }


      sensorRequestRunning = true;


      try {

        const data =
          await fetchJSON(
            "/api/state",
            4000
          );


        updateSensorCards(data);

      }

      catch (error) {

        console.error(
          "[SENSOR ERROR]",
          error
        );


        const apiStatus =
          document.getElementById(
            "apiStatus"
          );


        apiStatus.textContent =
          "OFFLINE";


        apiStatus.className =
          "ml-2 font-semibold text-red-400";


        document.getElementById(
          "lastUpdate"
        ).textContent =
          `Sensor error: ${error.message}`;

      }

      finally {

        sensorRequestRunning = false;

      }

    }


    /*
    |--------------------------------------------------------------------------
    | CAMERA
    |--------------------------------------------------------------------------
    */

    function getCameraId(camera, index) {

      /*
       * Pakai ID backend kalau memang formatnya:
       *
       * camera_1
       * camera_2
       * dst.
       */
      const explicitId =
        camera?.id ||
        camera?.camera_id ||
        camera?.cameraId ||
        camera?.key;


      if (
        explicitId &&
        /^camera_\d+$/i.test(
          String(explicitId)
        )
      ) {

        return String(
          explicitId
        ).toLowerCase();

      }


      /*
       * Jangan gunakan channel Hikvision 101,
       * 201, 301 sebagai nama folder HLS.
       */
      return `camera_${index + 1}`;

    }


    function getCameraName(camera, index) {

      return (
        camera?.name ||
        camera?.label ||
        `Camera ${index + 1}`
      );

    }


    function getCameraStreamUrl(
      camera,
      index
    ) {

      return (
        `/api/hls/` +
        `${getCameraId(camera, index)}` +
        `/index.m3u8`
      );

    }


    function updateCameraStatus(
      index,
      type,
      message = ""
    ) {

      const dot =
        document.getElementById(
          `camera-dot-${index}`
        );


      const label =
        document.getElementById(
          `camera-label-${index}`
        );


      const messageElement =
        document.getElementById(
          `camera-message-${index}`
        );


      if (
        !dot ||
        !label
      ) {
        return;
      }


      const statusMap = {

        loading: {

          dot: "dot-warn",

          text: "text-amber-400",

          label: "LOADING"

        },

        live: {

          dot: "dot-ok",

          text: "text-emerald-400",

          label: "LIVE"

        },

        retry: {

          dot: "dot-warn",

          text: "text-amber-400",

          label: "RETRY"

        },

        error: {

          dot: "dot-alert",

          text: "text-red-400",

          label: "ERROR"

        }

      };


      const config =
        statusMap[type] ||
        {

          dot: "dot-idle",

          text: "text-slate-400",

          label: "IDLE"

        };


      dot.className =
        `status-dot ${config.dot}`;


      label.className =
        `
    text-[10px]
    font-bold
    tracking-widest
    ${config.text}
    `;


      label.textContent =
        config.label;


      if (messageElement) {

        messageElement.textContent =
          message;

      }

    }


    function showVideo(index) {

      const video =
        document.getElementById(
          `video-${index}`
        );


      const placeholder =
        document.getElementById(
          `camera-placeholder-${index}`
        );


      if (placeholder) {

        placeholder.classList.add(
          "hidden"
        );

      }


      if (video) {

        video.classList.remove(
          "hidden"
        );

      }

    }


    function destroyCameraPlayer(index) {

      const player =
        players.get(index);


      if (player) {

        try {

          player.destroy();

        }

        catch (_) {
        }


        players.delete(index);

      }

    }


    function restartCamera(
      camera,
      index,
      delay = 3000
    ) {

      /*
       * Jangan bikin 20 timer restart
       * untuk kamera yang sama.
       */
      if (
        restartTimers.has(index)
      ) {

        return;

      }


      destroyCameraPlayer(index);


      const timer =
        setTimeout(() => {

          restartTimers.delete(index);

          startCamera(
            camera,
            index
          );

        }, delay);


      restartTimers.set(
        index,
        timer
      );

    }


    function startCamera(
      camera,
      index
    ) {

      const video =
        document.getElementById(
          `video-${index}`
        );


      if (!video) {
        return;
      }


      /*
       * Kalau player sudah hidup,
       * jangan dibuat lagi.
       */
      if (
        players.has(index)
      ) {

        return;

      }


      const streamUrl =
        getCameraStreamUrl(
          camera,
          index
        );


      console.log(
        `[CAMERA ${index + 1}]`,
        streamUrl
      );


      updateCameraStatus(
        index,
        "loading",
        "Menghubungkan stream..."
      );


      /*
       * Chrome / Firefox / Edge.
       */
      if (
        window.Hls &&
        Hls.isSupported()
      ) {

        const hls =
          new Hls({

            enableWorker: true,

            /*
             * CCTV live.
             */
            lowLatencyMode: true,

            /*
             * Jaga dekat live edge.
             */
            liveSyncDurationCount: 2,

            liveMaxLatencyDurationCount: 5,

            /*
             * Jangan menyimpan buffer besar.
             */
            maxBufferLength: 6,

            maxMaxBufferLength: 12,

            backBufferLength: 0,

            maxBufferHole: 0.5,

            /*
             * Retry bawaan HLS.
             */
            manifestLoadingMaxRetry: 5,

            manifestLoadingRetryDelay: 1000,

            levelLoadingMaxRetry: 5,

            fragLoadingMaxRetry: 5

          });


        players.set(
          index,
          hls
        );


        hls.loadSource(
          streamUrl
        );


        hls.attachMedia(
          video
        );


        /*
         * Manifest sudah tersedia.
         */
        hls.on(
          Hls.Events.MANIFEST_PARSED,
          () => {

            console.log(
              `[CAMERA ${index + 1}] LIVE`
            );


            showVideo(index);


            updateCameraStatus(
              index,
              "live",
              ""
            );


            video
              .play()
              .catch(() => { });

          }
        );


        /*
         * Kalau video benar-benar bergerak.
         */
        video.addEventListener(
          "playing",
          () => {

            updateCameraStatus(
              index,
              "live",
              ""
            );

          }
        );


        /*
         * HLS error.
         */
        hls.on(
          Hls.Events.ERROR,
          (
            event,
            data
          ) => {

            if (!data.fatal) {
              return;
            }


            console.warn(
              `[CAMERA ${index + 1}]`,
              data.type,
              data.details
            );


            /*
             * Network error.
             *
             * Biasanya playlist belum dibuat
             * oleh bridge / FFmpeg.
             */
            if (
              data.type ===
              Hls.ErrorTypes.NETWORK_ERROR
            ) {

              updateCameraStatus(
                index,
                "retry",
                "Menunggu stream..."
              );


              /*
               * Restart player secara terkontrol.
               */
              restartCamera(
                camera,
                index,
                2500
              );


              return;

            }


            /*
             * Media decoder error.
             */
            if (
              data.type ===
              Hls.ErrorTypes.MEDIA_ERROR
            ) {

              updateCameraStatus(
                index,
                "retry",
                "Recover media..."
              );


              try {

                hls.recoverMediaError();

              }

              catch (_) {

                restartCamera(
                  camera,
                  index,
                  2500
                );

              }


              return;

            }


            /*
             * Unknown fatal error.
             */
            updateCameraStatus(
              index,
              "error",
              "Restart stream..."
            );


            restartCamera(
              camera,
              index,
              3000
            );

          }
        );


        return;

      }


      /*
       * Safari native HLS.
       */
      if (
        video.canPlayType(
          "application/vnd.apple.mpegurl"
        )
      ) {

        video.src =
          streamUrl;


        video.addEventListener(
          "loadedmetadata",
          () => {

            showVideo(index);


            updateCameraStatus(
              index,
              "live",
              ""
            );


            video
              .play()
              .catch(() => { });

          },
          {
            once: true
          }
        );


        video.addEventListener(
          "error",
          () => {

            updateCameraStatus(
              index,
              "retry",
              "Retry stream..."
            );


            setTimeout(
              () => {

                video.load();

              },
              2500
            );

          }
        );


        return;

      }


      updateCameraStatus(
        index,
        "error",
        "Browser tidak mendukung HLS"
      );

    }


    /*
    |--------------------------------------------------------------------------
    | LOAD CAMERA LIST
    |--------------------------------------------------------------------------
    */

    async function loadCameras() {

      /*
       * Ini yang paling penting.
       *
       * loadCameras cuma boleh jalan sekali.
       */
      if (camerasLoaded) {

        return;

      }


      const grid =
        document.getElementById(
          "videoGrid"
        );


      try {

        const payload =
          await fetchJSON(
            "/api/cameras",
            6000
          );


        const cameras =
          Array.isArray(payload)

            ? payload

            : Array.isArray(
              payload?.cameras
            )

              ? payload.cameras

              : [];


        document.getElementById(
          "cameraCount"
        ).textContent =
          `${cameras.length} kamera`;


        if (
          cameras.length === 0
        ) {

          grid.innerHTML = `

        <div
          class="
            col-span-full
            rounded-xl
            border border-slate-800
            bg-slate-900
            p-4
            text-sm
            text-slate-400
          "
        >

          Tidak ada kamera
          dari /api/cameras.

        </div>

      `;


          return;

        }


        /*
         * Setelah berhasil mendapat daftar,
         * jangan fetch ulang terus menerus.
         */
        camerasLoaded = true;


        grid.innerHTML =
          cameras
            .map(
              (
                camera,
                index
              ) => {

                const cameraId =
                  getCameraId(
                    camera,
                    index
                  );


                const cameraName =
                  getCameraName(
                    camera,
                    index
                  );


                return `

              <article
                class="
                  overflow-hidden
                  rounded-xl
                  border border-slate-800
                  bg-slate-900
                  shadow-lg
                "
              >

                <div
                  class="
                    flex
                    items-center
                    justify-between
                    gap-3
                    px-4 py-3
                  "
                >

                  <div class="min-w-0">

                    <div
                      class="
                        truncate
                        text-sm
                        font-semibold
                        text-slate-200
                      "
                    >
                      ${escapeHtml(cameraName)}
                    </div>


                    <div
                      class="
                        mt-1
                        text-[10px]
                        text-slate-600
                      "
                    >
                      ${escapeHtml(cameraId)}
                    </div>

                  </div>


                  <div
                    class="
                      flex
                      items-center
                      gap-2
                    "
                  >

                    <span
                      id="camera-dot-${index}"
                      class="
                        status-dot
                        dot-warn
                      "
                    ></span>

                    <span
                      id="camera-label-${index}"
                      class="
                        text-[10px]
                        font-bold
                        tracking-widest
                        text-amber-400
                      "
                    >
                      LOADING
                    </span>

                  </div>

                </div>


                <div
                  class="
                    relative
                    aspect-video
                    bg-black
                  "
                >

                  <div
                    id="camera-placeholder-${index}"
                    class="
                      absolute
                      inset-0
                      flex
                      flex-col
                      items-center
                      justify-center
                      gap-3
                      text-slate-500
                    "
                  >

                    <div class="spinner"></div>


                    <div
                      id="camera-message-${index}"
                      class="
                        px-4
                        text-center
                        text-[11px]
                      "
                    >
                      Menyiapkan stream...
                    </div>

                  </div>


                  <video
                    id="video-${index}"

                    class="
                      video-stream
                      hidden
                    "

                    autoplay

                    muted

                    playsinline

                    controls

                    preload="none"
                  ></video>

                </div>

              </article>

            `;

              }
            )
            .join("");


        /*
         * Start kamera secara bertahap.
         */
        for (
          let index = 0;
          index < cameras.length;
          index++
        ) {

          startCamera(
            cameras[index],
            index
          );


          if (
            index <
            cameras.length - 1
          ) {

            await new Promise(
              resolve =>
                setTimeout(
                  resolve,
                  CAMERA_STAGGER_MS
                )
            );

          }

        }

      }

      catch (error) {

        console.error(
          "[CAMERA LIST ERROR]",
          error
        );


        grid.innerHTML = `

      <div
        class="
          col-span-full
          rounded-xl
          border border-red-900/70
          bg-red-950/30
          p-4
          text-sm
          text-red-300
        "
      >

        Gagal mengambil kamera:

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

      }

    }


    /*
    |--------------------------------------------------------------------------
    | START DASHBOARD
    |--------------------------------------------------------------------------
    */

    document.addEventListener(
      "DOMContentLoaded",
      async () => {

        /*
         * Buat card sensor sekali.
         */
        renderSensorCards();


        /*
         * Load data awal.
         */
        await pollSensors();


        /*
         * Sensor refresh terus.
         *
         * Kamera TIDAK ikut dipanggil.
         */
        setInterval(
          pollSensors,
          SENSOR_REFRESH_MS
        );


        /*
         * Kamera hanya di-load sekali.
         */
        loadCameras();

      }
    );


    /*
    |--------------------------------------------------------------------------
    | CLEANUP
    |--------------------------------------------------------------------------
    */

    window.addEventListener(
      "beforeunload",
      () => {

        for (
          const player of players.values()
        ) {

          try {
            player.destroy();
          }

          catch (_) {
          }

        }


        players.clear();


        for (
          const timer of restartTimers.values()
        ) {

          clearTimeout(timer);

        }


        restartTimers.clear();

      }
    );

  </script>

</body>

</html>
